<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're on the list · Zakah Assistant</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <main class="wrap prose">
    <div class="card">
      <h1>JazakAllahu khayran, you're on the list</h1>
      <p>We'll send you Ramadan reminders and updates on the Gaza orphans fundraiser. You can unsubscribe from any email.</p>
      <p><a class="btn primary" id="donate" href="index.html">Back to the zakah calculator</a></p>
    </div>
  </main>
  <script>
    const c = window.ZAKAH_CONFIG || {};
    if (c.fundraiserUrl) { const a = document.getElementById('donate'); a.href = c.fundraiserUrl; a.textContent = 'Give to Gaza orphans'; }
  </script>
</body>
</html>
